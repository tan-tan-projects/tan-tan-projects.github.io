      function googleTranslateElementInit() {
        new google.translate.TranslateElement(
          {
            pageLanguage: 'en',
            autoDisplay: false,
          },
          'google_translate_element',
        )

        detectCountryAndTranslate()
      }

      async function detectCountryAndTranslate() {
        let language = null

        try {
          const response = await fetch('https://ipapi.co/json/')

          if (response.ok) {
            const data = await response.json()

            const countryCode = (data.country_code || '').toUpperCase()

            language = countryLanguageMap[countryCode] || null
          }
        } catch {}

        /*
         * Jika country detection gagal,
         * fallback ke bahasa browser.
         */
        if (!language) {
          language = (navigator.language || navigator.userLanguage || 'en')
            .toLowerCase()
            .split('-')[0]
        }

        /*
         * English tidak perlu diterjemahkan.
         */
        if (language === 'en') {
          return
        }

        const supportedLanguages = [
          'id',
          'ja',
          'ko',
          'zh',
          'zh-TW',
          'es',
          'fr',
          'de',
          'it',
          'pt',
          'ar',
          'ru',
          'hi',
          'nl',
          'tr',
          'vi',
          'th',
        ]

        if (!supportedLanguages.includes(language)) {
          return
        }

        translateTo(language)
      }

      function translateTo(language) {
        let attempts = 0

        const timer = setInterval(() => {
          attempts++

          const select = document.querySelector('.goog-te-combo')

          if (select) {
            clearInterval(timer)

            select.value = language

            select.dispatchEvent(
              new Event('change', {
                bubbles: true,
              }),
            )

            return
          }

          if (attempts >= 50) {
            clearInterval(timer)
          }
        }, 200)
      }</script><script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>  <script type="module" crossorigin src="/assets/index-C3Dqwtwx.js"></script>
